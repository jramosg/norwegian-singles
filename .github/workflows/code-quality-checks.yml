name: Code Quality Checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-check:
    name: Run Prettier and TypeScript checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Node version from .nvmrc
        id: node_version
        run: |
          if [ -f .nvmrc ]; then
            ver=$(cat .nvmrc | tr -d " \t\n")
            echo "version=$ver" >> $GITHUB_OUTPUT
          else
            # Fallback to a sensible default if .nvmrc is missing
            echo "version=22" >> $GITHUB_OUTPUT
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 8

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run format:check
        run: pnpm run format:check

      - name: Run check
        run: pnpm run check

      - name: Run tests
        run: pnpm test

  docker-build:
    name: Build production Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --tag site:ci .
