name: Deploy to Server

on:
  # Deploy only after Code Quality Checks pass on master.
  workflow_run:
    workflows: ['Code Quality Checks']
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy to Server
    runs-on: ubuntu-latest
    # The branches filter and head_branch also match a fork PR from a
    # branch named "master"; require a push to this repository so fork
    # code never runs next to the deploy key. [skip deploy] in the commit
    # message skips the deploy; manual runs always deploy.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'master' &&
        !contains(github.event.workflow_run.head_commit.message, '[skip deploy]')
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker image
        run: |
          # Build the Docker image
          docker build -t norwegian-singles:latest .

          # Save the image as a tar file for transfer
          docker save norwegian-singles:latest -o norwegian-singles.tar

      - name: Deploy through the restricted CI gate
        # The key can only run `deploy norwegian-singles` on the server;
        # compose and .env there are admin-managed (see vps-ops/ci-deploy).
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEmoaMAZ9yKpppVl6J2NPsXsirLII1K5/FR47keXM215
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "vps $HOST_KEY" > ~/.ssh/known_hosts
          gzip -1 -c norwegian-singles.tar | ssh -i ~/.ssh/deploy \
            -o HostKeyAlias=vps -o StrictHostKeyChecking=yes \
            "ci@$SERVER_HOST" deploy norwegian-singles

      - name: Verify site
        run: |
          set -eu
          site=https://norwegian-singles.app
          # The root must serve the static language chooser, not a redirect.
          test "$(curl -s --retry 5 --retry-delay 3 -o /dev/null \
            -w '%{http_code}' "$site/")" = 200
          # Discovery files must contain their own content, not fallback HTML.
          curl -fsS "$site/llms.txt" | grep -q '^# Norwegian Singles'
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            "$site/missing-resource-health-check.json")" = 404
