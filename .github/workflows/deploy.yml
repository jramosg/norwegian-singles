name: Deploy to Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy to Server
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          # Build the Docker image
          docker build -t norwegian-singles:latest .

          # Save the image as a tar file for transfer
          docker save norwegian-singles:latest -o norwegian-singles.tar

      - name: Deploy through the restricted CI gate
        # The key can only run `deploy norwegian-singles` on the server;
        # compose and .env there are admin-managed (see vps-ops/ci-deploy).
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEmoaMAZ9yKpppVl6J2NPsXsirLII1K5/FR47keXM215
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "vps $HOST_KEY" > ~/.ssh/known_hosts
          gzip -1 -c norwegian-singles.tar | ssh -i ~/.ssh/deploy \
            -o HostKeyAlias=vps -o StrictHostKeyChecking=yes \
            "ci@$SERVER_HOST" deploy norwegian-singles

      - name: Verify site
        run: |
          set -eu
          site=https://norwegian-singles.app
          # The root must serve the static language chooser, not a redirect.
          test "$(curl -s --retry 5 --retry-delay 3 -o /dev/null \
            -w '%{http_code}' "$site/")" = 200
          # Discovery files must contain their own content, not fallback HTML.
          curl -fsS "$site/llms.txt" | grep -q '^# Norwegian Singles'
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            "$site/missing-resource-health-check.json")" = 404
