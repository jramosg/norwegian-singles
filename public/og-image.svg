<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="0.52" stop-color="#141416"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M0 482 C 160 402, 260 534, 426 468 S 720 306, 908 384 S 1110 516, 1200 430 L 1200 630 L 0 630 Z" fill="#172554" opacity="0.45"/>
  <path d="M0 506 C 180 426, 314 560, 500 492 S 772 342, 970 420 S 1116 548, 1200 472" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.55"/>
  <path d="M0 454 C 180 374, 304 508, 492 440 S 760 292, 952 370 S 1120 498, 1200 422" fill="none" stroke="#ef4444" stroke-width="4" opacity="0.75"/>

