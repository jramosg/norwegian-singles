    <text x="760" y="198" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">20:00 5K</text>
    <g font-family="Inter, Arial, sans-serif" font-size="20">
      <rect x="760" y="236" width="280" height="52" rx="12" fill="#ffffff" fill-opacity="0.055"/>
      <text x="782" y="269" fill="#a1a1aa">Tue</text>
      <text x="842" y="269" fill="#fafafa" font-weight="700">3 x 10 min</text>
      <text x="954" y="269" fill="#f59e0b" font-weight="800">4:28/km</text>
      <rect x="760" y="304" width="280" height="52" rx="12" fill="#ffffff" fill-opacity="0.055"/>
      <text x="782" y="337" fill="#a1a1aa">Thu</text>
      <text x="842" y="337" fill="#fafafa" font-weight="700">5 x 6 min</text>
      <text x="954" y="337" fill="#f59e0b" font-weight="800">4:15/km</text>
      <rect x="760" y="372" width="280" height="52" rx="12" fill="#ffffff" fill-opacity="0.055"/>
      <text x="782" y="405" fill="#a1a1aa">Sat</text>
      <text x="842" y="405" fill="#fafafa" font-weight="700">9 x 3 min</text>
