    <text x="96" y="226" fill="#fafafa" font-size="76" font-weight="900">Norwegian</text>
    <text x="96" y="306" fill="url(#accent)" font-size="76" font-weight="900">Singles Calculator</text>
    <text x="100" y="370" fill="#d4d4d8" font-size="30" font-weight="600">Sub-threshold paces, weekly plans,</text>
    <text x="100" y="410" fill="#d4d4d8" font-size="30" font-weight="600">and marathon builds from 5K or 10K.</text>
    <g font-size="24" font-weight="800">
